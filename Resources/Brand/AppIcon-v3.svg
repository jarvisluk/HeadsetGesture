<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Headset Gesture intercepted button icon concept</title>
  <desc>A wired inline button intercepts a white input signal and remaps it into a cyan redirected output.</desc>

  <rect x="64" y="64" width="896" height="896" rx="208" fill="#101D36"/>

  <!-- Incoming headset cable / input signal. -->
  <path
    d="M184 512 H352"
    fill="none"
    stroke="#F7F4EC"
    stroke-width="44"
    stroke-linecap="round"
  />

  <!-- Remapped output changes both color and direction after the button. -->
  <path
    d="M672 512 H742 C790 512 806 482 806 438 V352"
    fill="none"
    stroke="#2ED6C5"
    stroke-width="44"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Abstract inline remote body. -->
  <rect
    x="352"
    y="402"
    width="320"
    height="220"
    rx="92"
    fill="#101D36"
    stroke="#F7F4EC"
    stroke-width="40"
  />

  <!-- The intercepted physical keycap, drawn with two flat layers. -->
  <rect x="440" y="452" width="144" height="144" rx="40" fill="#168D89"/>
  <rect x="440" y="428" width="144" height="144" rx="40" fill="#2ED6C5"/>
</svg>
