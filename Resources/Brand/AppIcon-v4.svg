<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Headset Gesture native macOS icon concept</title>
  <desc>A graphite input cable enters an inline button and leaves as a redirected system-blue output.</desc>

  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F8FA"/>
      <stop offset="0.55" stop-color="#E4E6EA"/>
      <stop offset="1" stop-color="#CDD0D6"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5AC8FA"/>
      <stop offset="0.55" stop-color="#0A84FF"/>
      <stop offset="1" stop-color="#007AFF"/>
    </linearGradient>
    <linearGradient id="keyFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#64D2FF"/>
      <stop offset="1" stop-color="#0A84FF"/>
    </linearGradient>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.20"/>
    </filter>
    <filter id="controlShadow" x="-30%" y="-40%" width="160%" height="190%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1C1C1E" flood-opacity="0.20"/>
    </filter>
    <clipPath id="tileClip">
      <rect x="64" y="64" width="896" height="896" rx="208"/>
    </clipPath>
  </defs>

  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#tile)" filter="url(#tileShadow)"/>

  <!-- A restrained glass highlight, clipped to the icon tile. -->
  <ellipse cx="430" cy="94" rx="470" ry="330" fill="#FFFFFF" opacity="0.34" clip-path="url(#tileClip)"/>
  <rect x="65" y="65" width="894" height="894" rx="207" fill="none" stroke="#FFFFFF" stroke-opacity="0.78" stroke-width="3"/>

  <!-- Incoming physical headset-button signal in system graphite. -->
  <path
    d="M184 512 H352"
    fill="none"
    stroke="#3A3A3C"
    stroke-width="44"
    stroke-linecap="round"
  />

  <!-- Remapped output uses the macOS system-blue family as semantic accent. -->
  <path
    d="M672 512 H742 C790 512 806 482 806 438 V352"
    fill="none"
    stroke="url(#accent)"
    stroke-width="44"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Frosted inline controller. -->
  <rect
    x="352"
    y="402"
    width="320"
    height="220"
    rx="92"
    fill="#FFFFFF"
    fill-opacity="0.88"
    stroke="#3A3A3C"
    stroke-width="34"
    filter="url(#controlShadow)"
  />
  <path d="M426 431 H598" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" opacity="0.82"/>

  <!-- Physical keycap: a darker base plus a system-blue face. -->
  <rect x="440" y="452" width="144" height="144" rx="40" fill="#0066CC"/>
  <rect x="440" y="428" width="144" height="144" rx="40" fill="url(#keyFace)"/>
  <path d="M470 450 H554" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.56"/>
</svg>
